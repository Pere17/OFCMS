databases:
  - name: ofcms-db
    plan: free
    databaseName: ofcms
    user: ofcms

services:
  - type: web
    name: ofcms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Online Feedback and Complaint Management System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ofcms-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ofcms-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ofcms-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ofcms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ofcms-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
